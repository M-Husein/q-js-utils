name: Publish to npm

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '20.x'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Uncomment if you have tests
      # - name: Run tests
      #   run: npm run test

      - name: Build library
        run: npm run build

      # Debug step – remove after validation
      - name: Debug npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_Q_JS_UTILS }}

      - name: Check for existing npm version
        id: check_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "Checking version $VERSION for $PACKAGE_NAME"
          if npm view "$PACKAGE_NAME@$VERSION" >/dev/null 2>&1; then
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on npm. Skipping publish."
          else
            echo "version_exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION does not exist on npm. Proceeding with publish."
          fi
        shell: bash

      - name: Publish to npm
        if: steps.check_version.outputs.version_exists == 'false'
        run: npm publish --access public --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_Q_JS_UTILS }}
